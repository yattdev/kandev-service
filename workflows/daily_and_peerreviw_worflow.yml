version: 1
type: kandev_workflow
workflows:
    - name: Daily workflow
      prompt: '@workstep-prompt'
      steps:
        - name: Backlogs
          position: 0
          color: bg-slate-500
          prompt: "@dw-backlogs"
          events: {}
          is_start_step: true
          show_in_command_panel: true
          allow_manual_move: true
          auto_advance_requires_signal: false
          cancel_triggers_turn_complete: false
        - name: Spec
          position: 1
          color: bg-purple-500
          prompt: |-
            {{task_prompt}}
            @dw-spec
          events:
            on_enter:
                - type: enable_plan_mode
                - type: auto_start_agent
            on_turn_complete:
                - type: disable_plan_mode
                - type: move_to_next
            on_exit:
                - type: disable_plan_mode
          is_start_step: false
          show_in_command_panel: true
          allow_manual_move: true
          agent_profile:
            agent_name: Copilot
            model: savoirfairelinux/DeepInfra/deepseek-ai%2FDeepSeek-V4-Pro
            mode: https://agentclientprotocol.com/protocol/session-modes#agent
          auto_advance_requires_signal: true
          cancel_triggers_turn_complete: false
        - name: Todo
          position: 2
          color: bg-slate-500
          events:
            on_turn_start:
                - type: move_to_step
                  config:
                    step_position: 1
          is_start_step: false
          show_in_command_panel: false
          allow_manual_move: true
          auto_advance_requires_signal: false
          cancel_triggers_turn_complete: false
        - name: Work
          position: 3
          color: bg-blue-500
          prompt: "@dw-work"
          events:
            on_enter:
                - type: auto_start_agent
            on_turn_complete:
                - type: move_to_step
                  config:
                    step_position: 4
          is_start_step: false
          show_in_command_panel: true
          allow_manual_move: true
          agent_profile:
            agent_name: Copilot
            model: savoirfairelinux/DeepInfra/deepseek-ai%2FDeepSeek-V4-Flash
            mode: https://agentclientprotocol.com/protocol/session-modes#agent
          auto_advance_requires_signal: true
          cancel_triggers_turn_complete: false
        - name: Review
          position: 4
          color: bg-yellow-500
          prompt: "@dw-review"
          events:
            on_enter:
                - type: reset_agent_context
                - type: auto_start_agent
            on_turn_complete:
                - type: move_to_next
          is_start_step: false
          show_in_command_panel: true
          allow_manual_move: true
          agent_profile:
            agent_name: Copilot
            model: savoirfairelinux/DeepInfra/zai-org%2FGLM-5.2
            mode: https://agentclientprotocol.com/protocol/session-modes#agent
          auto_advance_requires_signal: true
          cancel_triggers_turn_complete: false
        - name: QA
          position: 5
          color: bg-orange-500
          prompt: "@dw-qa"
          events:
            on_enter:
                - type: auto_start_agent
            on_turn_complete:
                - type: move_to_step
                  config:
                    step_position: 6
          is_start_step: false
          show_in_command_panel: true
          allow_manual_move: true
          agent_profile:
            agent_name: Copilot
            model: savoirfairelinux/DeepInfra/moonshotai%2FKimi-K3
            mode: https://agentclientprotocol.com/protocol/session-modes#agent
          auto_advance_requires_signal: true
          cancel_triggers_turn_complete: false
        - name: PR
          position: 6
          color: bg-indigo-500
          prompt: "@dw-pull-request"
          events:
            on_enter:
                - type: auto_start_agent
            on_turn_complete:
                - type: move_to_next
          is_start_step: false
          show_in_command_panel: true
          allow_manual_move: true
          agent_profile:
            agent_name: Copilot
            model: savoirfairelinux/DeepInfra/deepseek-ai%2FDeepSeek-V4-Flash
            mode: https://agentclientprotocol.com/protocol/session-modes#agent
          auto_advance_requires_signal: true
          cancel_triggers_turn_complete: false
        - name: CI Fixup
          position: 7
          color: bg-amber-500
          prompt: "@dw-ci-fixup"
          events:
            on_enter:
                - type: auto_start_agent
            on_turn_complete:
                - type: move_to_next
          is_start_step: false
          show_in_command_panel: true
          allow_manual_move: true
          agent_profile:
            agent_name: Copilot
            model: savoirfairelinux/DeepInfra/deepseek-ai%2FDeepSeek-V4-Flash
            mode: https://agentclientprotocol.com/protocol/session-modes#agent
          auto_advance_requires_signal: true
          cancel_triggers_turn_complete: false
        - name: Human-QA
          position: 8
          color: bg-orange-500
          prompt: "@dw-human-qa-review"
          events:
            on_enter:
                - type: auto_start_agent
          is_start_step: false
          show_in_command_panel: false
          allow_manual_move: true
          agent_profile:
            agent_name: Copilot
            model: savoirfairelinux/DeepInfra/deepseek-ai%2FDeepSeek-V4-Flash
            mode: https://agentclientprotocol.com/protocol/session-modes#agent
          auto_advance_requires_signal: false
          cancel_triggers_turn_complete: false
        - name: ToDeploy
          position: 9
          color: bg-cyan-500
          events: {}
          is_start_step: false
          show_in_command_panel: false
          allow_manual_move: true
          auto_advance_requires_signal: false
          cancel_triggers_turn_complete: false
        - name: Done
          position: 10
          color: bg-green-500
          prompt: '@dw-done'
          events:
            on_enter:
                - type: auto_start_agent
          is_start_step: false
          show_in_command_panel: true
          allow_manual_move: true
          auto_archive_after_hours: 72
          agent_profile:
            agent_name: Copilot
            model: savoirfairelinux/DeepInfra/deepseek-ai%2FDeepSeek-V4-Flash
            mode: https://agentclientprotocol.com/protocol/session-modes#agent
          auto_advance_requires_signal: false
          cancel_triggers_turn_complete: false
    - name: PR Review
      steps:
        - name: Backlogs
          position: 0
          color: bg-neutral-400
          events: {}
          is_start_step: true
          show_in_command_panel: false
          allow_manual_move: true
          auto_advance_requires_signal: false
          cancel_triggers_turn_complete: false
        - name: Review
          position: 1
          color: bg-yellow-500
          prompt: |-
            {{task_prompt}}
            @pr-review
          events:
            on_enter:
                - type: auto_start_agent
          is_start_step: false
          show_in_command_panel: true
          allow_manual_move: true
          agent_profile:
            agent_name: Copilot
            model: savoirfairelinux/DeepInfra/zai-org%2FGLM-5.2
            mode: https://agentclientprotocol.com/protocol/session-modes#agent
          auto_advance_requires_signal: false
          cancel_triggers_turn_complete: false
        - name: QA
          position: 2
          color: bg-blue-500
          prompt: |-
            {{task_prompt}}
            @pr-qa
          events:
            on_enter:
                - type: auto_start_agent
          is_start_step: false
          show_in_command_panel: true
          allow_manual_move: true
          agent_profile:
            agent_name: Copilot
            model: savoirfairelinux/DeepInfra/moonshotai%2FKimi-K3
            mode: https://agentclientprotocol.com/protocol/session-modes#agent
          auto_advance_requires_signal: false
          cancel_triggers_turn_complete: false
        - name: Human-QA
          position: 3
          color: bg-cyan-500
          prompt: |-
            {{task_prompt}}
            @dw-human-qa-review
          events:
            on_enter:
                - type: auto_start_agent
            on_turn_start:
                - type: move_to_step
                  config:
                    step_position: 1
          is_start_step: false
          show_in_command_panel: false
          allow_manual_move: true
          agent_profile:
            agent_name: Copilot
            model: savoirfairelinux/DeepInfra/deepseek-ai%2FDeepSeek-V4-Flash
            mode: https://agentclientprotocol.com/protocol/session-modes#agent
          auto_advance_requires_signal: false
          cancel_triggers_turn_complete: false
        - name: Done
          position: 4
          color: bg-green-500
          prompt: '@dw-done'
          events:
            on_enter:
                - type: auto_start_agent
          is_start_step: false
          show_in_command_panel: true
          allow_manual_move: true
          auto_archive_after_hours: 72
          agent_profile:
            agent_name: Claude
            model: sonnet
            mode: bypassPermissions
          auto_advance_requires_signal: false
          cancel_triggers_turn_complete: false

