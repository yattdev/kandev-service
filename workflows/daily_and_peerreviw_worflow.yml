          prompt: |-
            {{task_prompt}}
            @dw-human-qa-review
          events:
            on_enter:
                - type: auto_start_agent
          is_start_step: false
          show_in_command_panel: false
          allow_manual_move: true
          agent_profile:
            agent_name: Claude
            model: sonnet
