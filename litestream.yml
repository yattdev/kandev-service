# litestream.yml — Litestream configuration template.
# Installed to ~/.config/litestream/litestream.yml on each satellite host.
#
# key-path MUST be set per host (see install scripts):
#   sfl-desktop  → key that reaches alassane@10.0.0.182
#   yattara-pc   → ~/.ssh/yattara-pc
#
# mini-desktop is the hub — it stores the replica but does NOT run Litestream.
#
# Replica path on mini: ~/litestream-replicas/kandev/
# (must exist before first replication; created by install-mini.sh)
dbs:
  - path: /data/kandev.db
    replicas:
      - type: sftp
        host: "10.0.0.182"
        user: alassane
        key-path: /root/.ssh/REPLACE_WITH_KEY_NAME
        known-hosts-path: /root/.ssh/known_hosts
        path: /home/alassane/litestream-replicas/kandev
