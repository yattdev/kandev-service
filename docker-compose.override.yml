# docker-compose.override.yml — automatically merged with docker-compose.yml by Docker Compose.
# Adds: local image build (Dockerfile.local) + host identity/config volume mounts
# so that ssh, git, gh, and glab inside the container behave exactly like on the host.
#
# For SSH agent forwarding (passphrase caching, agent-forwarding to remote hosts):
#   use the kandev-ssh-agent.sh helper instead of `docker compose up` directly.
#
# To opt-out of this file temporarily:
#   docker compose -f docker-compose.yml up -d
services:
  kandev:
    # Build from Dockerfile.local (extends upstream image).
    # `image:` names the built result so update.sh can reference it by tag.
    build:
      context: .
      dockerfile: Dockerfile.local
      network: host
      args:
        BASE_IMAGE: ghcr.io/kdlbs/kandev:latest
        BASE_IMAGE_ID: ${KANDEV_BASE_IMAGE_ID:-unknown}
    image: kandev-local:latest

    # Docker's default /dev/shm is 64 MB, which is far too small for Chrome:
    # headless runs crash with "Target closed" / SIGBUS partway through a test
    # suite. 2 GB is the size Google's own CI images use. (The usual workaround,
    # --disable-dev-shm-usage, is then unnecessary but still harmless.)
    shm_size: 2gb

    # Load secrets from .env (git-ignored). required: false so the container
    # starts even before .env is populated — tools just won't have API access.
    # After filling in .env, restart with: docker compose up -d --force-recreate
    env_file:
      - path: .env
        required: false

    environment:
      # Propagate the host username into the container.
      # The container OS user is named "kandev" but tools like git, ssh, gh, and
      # glab inspect $USER to display or record the current user's identity.
      # Without this, they would report "kandev" instead of "alice".
      - USER=${USER}

      # Same identity propagation via the POSIX fallback variable.
      # Some tools (certain git hooks, scripts, and older Unix utilities) read
      # $LOGNAME instead of $USER. Both must be set to the same value to ensure
      # consistent identity reporting across all tooling.
      - LOGNAME=${USER}

      # ── Host-path map for the Docker CLI wrapper ─────────────────────────────
      # The mounted docker.sock points at the HOST daemon, so it resolves every
      # bind-mount source on the HOST filesystem — container-only paths silently
      # become empty root-owned directories up there. /usr/local/bin/docker
      # (docker-host-path-wrapper.sh) rewrites them using these three values,
      # which are simply the inverse of the mounts declared below.
      # Keep in sync with any new host mount.
      - KANDEV_HOST_HOME=${HOME}
      - KANDEV_HOST_DATA_DIR=${HOME}/.local/share/kandev
      - KANDEV_HOST_CODE_DIR=${HOME}/Code

    volumes:
      # ── SSH ──────────────────────────────────────────────────────────────────
      # Full ~/.ssh directory: keys, config, known_hosts.
      # Paths in ~/.ssh/config use ~ which resolves to /data/home inside the
      # container (HOME=/data/home), so all IdentityFile entries work as-is.
      # Read-only: the container should never modify your private keys.
      - ${HOME}/.ssh:/data/home/.ssh:ro

      # ── Git ───────────────────────────────────────────────────────────────────
      # Global git identity (name, email, aliases, colour, etc.).
      # safe.directory=* is injected at the system level via Dockerfile.local
      # so repos under /data/home/Code/ are never flagged as "dubious ownership".
      - ${HOME}/.gitconfig:/data/home/.gitconfig:ro

      # ── GitHub CLI ────────────────────────────────────────────────────────────
      # Read-write: `gh auth login` writes tokens here.
      - ${HOME}/.config/gh:/data/home/.config/gh

      # ── GitLab CLI ────────────────────────────────────────────────────────────
      # Read-write: `glab auth login` writes tokens here.
      - ${HOME}/.config/glab-cli:/data/home/.config/glab-cli

      # ── Docker socket ─────────────────────────────────────────────────────────
      # Forwards the host Docker daemon socket into the container so that
      # `docker` and `docker compose` commands run against the host daemon.
      # The kandev user is added to the docker group (GID 984) during the image
      # build; group_add ensures the running process inherits that GID even if
      # the group table inside the container is not fully synchronised.
      # Override DOCKER_GID if your host docker group GID differs from 984:
      #   DOCKER_GID=<gid> docker compose up -d
      - /var/run/docker.sock:/var/run/docker.sock

      # ── Identity mounts (host path == container path) ─────────────────────────
      # The same two directories as above, mounted a second time at the exact
      # path the HOST knows them by. Nothing in kandev reads them here — they
      # exist so that a host path stays valid inside the container:
      #   * the CLI wrapper can chdir into the host-equivalent directory before
      #     running `docker compose`, which is what makes relative sources in a
      #     project's own compose file ("./src:/app") resolve to host paths;
      #   * the compose CLI can then still read the compose file and build
      #     context from that rewritten path.
      # Cheap: a bind mount of an already-mounted directory, no extra storage.
      - ${HOME}/.local/share/kandev:${HOME}/.local/share/kandev
      - ${HOME}/Code:${HOME}/Code

    group_add:
      - "${DOCKER_GID:-984}"
